[project]
name = "lifeguard-backend"
version = "0.2.0"
description = "LifeGuard AI - 독거노인 생활 안전 관리 서비스 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "httpx2>=2.13.1", "ruff>=0.8", "playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: 브라우저로 실제 화면을 조작하는 테스트 (Playwright, 느림)"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"] # 한국어 메시지가 긴 줄은 허용
